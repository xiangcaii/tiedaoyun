# tiedaoyun Release
# main 分支推送：构建并推送 web/server 镜像到 GHCR
# 对齐 HLD §12.5 与 plan T3
#
# 镜像地址：ghcr.io/<owner>/tiedaoyun-{server,web}:latest
# 占位 owner：tiedaoyun（实际仓库 owner 由 github.repository-username 自动解析）

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

  # 允许手动触发
  workflow_dispatch:

# main 分支推送时不要并发，避免镜像版本错乱
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== 构建并推送 server 镜像 =====
  server-image:
    name: Build & Push Server Image
    runs-on: ubuntu-latest
    # apps/server 代码就绪后才构建（T5 完成）
    if: hashFiles('apps/server/src/main.ts') != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tiedaoyun-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 构建并推送 web 镜像 =====
  web-image:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    # apps/web 代码就绪后才构建（T27 完成）
    if: hashFiles('apps/web/src/main.tsx') != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tiedaoyun-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
