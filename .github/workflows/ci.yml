# tiedaoyun CI
# PR 触发：lint / typecheck / test / build-image 4 个 job
# 对齐 HLD §12.5 与 plan T3
#
# 验收：推 PR 后 4 个 job 全绿（apps 代码未就绪时 build-image 自动跳过）

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 同一分支新推送时取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Job 1: Lint =====
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

  # ===== Job 2: TypeCheck =====
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  # ===== Job 3: Test =====
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        # T1 阶段无测试文件，pnpm -r run test 返回 "No projects matched" 并 exit 0
        # T5/T27 后各 app 提供 vitest 配置与 *.test.ts 文件
        run: pnpm test

  # ===== Job 4: Build Docker Images =====
  build-image:
    name: Build Images
    runs-on: ubuntu-latest
    # apps/server 与 apps/web 代码就绪后才真正构建（T5/T27 完成）
    # 当前 T3 阶段无源码，跳过以保持 CI 全绿
    if: hashFiles('apps/server/src/main.ts') != '' || hashFiles('apps/web/src/main.tsx') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          push: false
          tags: tiedaoyun/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          tags: tiedaoyun/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
