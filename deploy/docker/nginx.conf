# tiedaoyun 入口网关 nginx 配置
# 职责：1) /healthz 返回 200（nginx 自身健康检查）
#       2) /api/ /api/docs 反代到 server:3000
#       3) / 反代到 web:80（静态资源），SPA fallback 由 web 容器处理

upstream tiedaoyun_server {
  server server:3000;
  keepalive 32;
}

upstream tiedaoyun_web {
  server web:80;
  keepalive 16;
}

# 速率限制（基础防刷，http 上下文）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  # 健康检查（liveness）：nginx 自身存活即可
  # /readyz 反代到 server，反映依赖就绪状态
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /readyz {
    access_log off;
    proxy_pass http://tiedaoyun_server/readyz;
    proxy_set_header Host $host;
  }

  # API 反代
  location /api/ {
    proxy_pass http://tiedaoyun_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # 静态资源 / SPA 入口
  location / {
    proxy_pass http://tiedaoyun_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 上传文件大小限制（附件 / 图片）
  client_max_body_size 50m;

  # 速率限制（基础防刷）
  limit_req zone=api_limit burst=20 nodelay;
}
