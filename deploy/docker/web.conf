# tiedaoyun web 容器 nginx 配置
# 职责：托管 web 静态资源（Vite 构建产物），SPA fallback 到 index.html
# T2 阶段为占位首页，T27 完成后替换为真实构建产物

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback：所有未匹配静态文件的请求回到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源缓存（hash 化的资源文件）
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html 不缓存，确保发布即时生效
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    access_log off;
  }

  # 健康检查（web 容器自身）
  location = /__healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "web ok\n";
  }

  client_max_body_size 50m;
}
